<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Полка ссылок</title><style>body{font:17px system-ui;max-width:800px;margin:40px auto;padding:20px;background:#f4f6f9;color:#20304a}form,li{background:white;padding:20px;margin:12px 0;border-radius:12px}input,button{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}label{display:block;margin:10px 0}ul{padding:0;list-style:none}a{overflow-wrap:anywhere}#message{color:#a31c32}</style><h1>Полка ссылок</h1><p>Учебные материалы, которые хочется сохранить.</p><form id="add"><label>Название <input name="title" required maxlength="150"></label><label>Ссылка <input name="url" type="url" required maxlength="2000"></label><label>Тег <input name="tag" maxlength="40"></label><button>Сохранить</button></form><form id="filter"><label>Фильтр по тегу <input name="tag"></label><button>Найти</button></form><p id="message" role="status"></p><ul id="bookmarks"></ul><script src="/static/app.js" defer></script></html>
